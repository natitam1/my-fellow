name: Feature Request
description: Propose a new feature, improvement, or architectural enhancement
labels: ["enhancement"]
body:
  - type: dropdown
    id: app
    attributes:
      label: Target Component
      options:
        - apps/mobile
        - apps/api
        - apps/admin
        - apps/website
        - apps/bot
        - Shared packages / Infrastructure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What challenge or user need does this proposal solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the design, workflow, or API changes.
    validations:
      required: true
