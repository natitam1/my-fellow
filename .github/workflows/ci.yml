name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Shared Typecheck
        run: bun --filter @my-fellow/shared check-types

      - name: API Typecheck & Tests
        run: |
          bun --filter my-fellow-api check-types
          bun --filter my-fellow-api test
          bun --filter my-fellow-api build
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/my_fellow_test
          JWT_SECRET: ci-test-jwt-secret-placeholder-for-tests
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Web Typecheck, Lint & Build
        run: |
          bun --filter my-fellow-web check-types
          bun --filter my-fellow-web lint
          bun --filter my-fellow-web build

      - name: Bot Typecheck & Build
        run: |
          bun --filter my-fellow-bot check-types
          bun --filter my-fellow-bot build

      - name: Mobile Tests, Lint & Typecheck
        run: |
          bun --filter my-fellow-mobile test
          bun --filter my-fellow-mobile lint
          bun --filter my-fellow-mobile check-types
