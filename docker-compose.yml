version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: my-fellow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fellow
      POSTGRES_PASSWORD: fellow
      POSTGRES_DB: myfellow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7.0
    container_name: my-fellow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
